/* ---------- helpers ---------- */
const W = CONFIG.worldW, H = CONFIG.worldH, CELL = CONFIG.cell, LAG = CONFIG.lagoonW;   // W: the whole world; LAG: the lagoon, where the plankton, fish and visitors live
const regionAt = x => x >= CONFIG.flatCol * CELL ? 'flat' : x >= CONFIG.slopeCol * CELL ? 'slope' : 'lagoon';
const REGION_FLOW = { lagoon: 1, slope: 1.4, flat: 0.8 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const key = (c, r) => c + ',' + r;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = rng(CONFIG.seed);
const rr = (a, b) => a + Math.random() * (b - a);

function light(y) { return Math.pow(clamp(1 - y / H, 0, 1), CONFIG.lightPower); }
function lightLabel(l) { return l < CONFIG.dimBelow ? 'Dim' : l < CONFIG.brightAbove ? 'Fair' : 'Bright'; }
function cellCenter(c, r) { return { x: (c + 0.5) * CELL, y: (r + 0.5) * CELL }; }
function inBounds(c, r) { return c >= 0 && r >= 0 && c < game.cols && r < game.rows; }
function isRock(c, r) { return !inBounds(c, r) ? (r >= 0 || false) : game.grid[r * game.cols + c] >= 1; }   // 1 = rock, 2 = sand (the island's cells are solid too)
function isBed(c, r) { return !inBounds(c, r) ? r >= game.rows : game.grid[r * game.cols + c] === 1; }   // the side edges of the map are walls, not bedrock: no coral roots or finds support on them (Ethan 2026-11-17: storm fragments rooted on the left edge)   // bedrock only: sand anchors no coral
function cellAt(c, r) { return game.cells.get(key(c, r)); }
function floorY(x) { return game.floorRow[clamp(Math.floor(x / CELL), 0, game.cols - 1)] * CELL; }
function currentAt(x, y, t) { return REGION_FLOW[regionAt(x)] * CONFIG.currentAmp * (Math.sin(t * 0.11 + y * 0.002) * 0.7 + Math.sin(t * 0.27 + 1.3 + x * 0.001) * 0.3) + (game.storm ? stormSurge(x, y, t) : 0); }
function playerPos() {
  if (game.stage === 'polyp' && game.active) return cellCenter(game.active.c, game.active.r);
  return { x: game.larva.x, y: game.larva.y };
}
// coral types: p.type is branch | plate | brain | fan | anemone (p.anemone mirrors the last, kept for the older checks)
const typeOf = p => p.anemone ? 'anemone' : p.type || 'branch';
const tyN = t => t === true ? 'anemone' : t === false || !t ? 'branch' : t;   // older callers pass a boolean
const TY = t => CONFIG.types[tyN(t)] || CONFIG.types.branch;
const TYPE_NAME = { branch: 'Branching', plate: 'Plate', brain: 'Brain', fan: 'Sea fan', anemone: 'Anemone' };
Object.defineProperty(game, 'nextAnemone', { get() { return this.nextType === 'anemone'; }, set(v) { this.nextType = v ? 'anemone' : 'branch'; } });
function budCost(tp = game.nextType) {
  tp = tyN(tp);
  const n = game.polyps.length;   // crowding: a big colony spends more keeping old tissue alive (type and biodiversity factors come later)
  let c = (CONFIG.budCostBase + CONFIG.budCostPerPolyp * Math.max(0, n - 1)) * (1 + n / CONFIG.crowdDiv);
  if (has('G1')) c *= CONFIG.budEnergyFactor;
  if (game.active) { const T = linOf(game.active).traits; c *= (1 - CONFIG.traitGrowth * (T.growth - 3)) * (1 + CONFIG.gen.toughCost * (T.tough - 3)); }   // the source polyp's lineage: Growth cheaper, Toughness dearer
  return tp === 'anemone' ? c * CONFIG.anemoneCostMult + CONFIG.anemoneExtra : c * TY(tp).cost;
}
// energy cap: the larger of the flat floor and a few branching buds' worth, so a big colony can always afford its next bud
const energyCap = () => Math.max(CONFIG.maxEnergy, CONFIG.capBudMult * budCost(false));
const calciumCap = () => CONFIG.calciumMax + (has('G5') ? CONFIG.unl.g5.cap : 0) + game.polyps.reduce((a, p) => a + TY(typeOf(p)).caCap, 0);
function budCalcium(tp = game.nextType) { tp = tyN(tp); return has('G1') ? CONFIG.budCalcium * TY(tp).ca : 0; }
// null when a price {e, ca, bp} can be paid, otherwise what is missing (buds pay energy and calcium, unlocks may also cost BP)
// P-41: a plankton caught by hand is worth a share of the next bud (never less than the flat amount), so being there pays at any size
const handCatch = () => Math.max(CONFIG.planktonEnergy, budCost(false) / CONFIG.handCatchBud);
// P-32: a tip's energy price is a set number of buds' worth for its tier (CONFIG.treeBuds), never below its listed price
function costOf(id) {
  const c = CONFIG.cost[id], d = TREE.find(x => x.id === id), m = d ? (CONFIG.treeBuds || [])[d.tier - 1] || 0 : 0;
  return c.e && m ? Object.assign({}, c, { e: Math.max(c.e, Math.round(m * budCost(false))) }) : c;
}
function shortOf(c) {
  if (game.energy < (c.e || 0)) return `Need ${Math.ceil(c.e)} energy`;
  if (game.calcium < (c.ca || 0)) return `Need ${c.ca} calcium`;
  if (game.bp < (c.bp || 0)) return `Need ${c.bp} BP`;
  return null;
}
function budShort(tp = game.nextType) {
  if (game.energy < budCost(tp)) return `Need ${Math.ceil(budCost(tp))} energy to bud`;
  if (game.calcium < budCalcium(tp)) return `Need ${budCalcium(tp)} calcium to bud`;
  return null;
}

/* ---------- camera ---------- */
function screenToWorld(sx, sy) {
  const c = game.cam, v = game.view;
  return { x: (sx - v.w / 2) / c.zoom + c.x, y: (sy - v.h / 2) / c.zoom + c.y };
}
function worldToScreen(x, y) {
  const c = game.cam, v = game.view;
  return { x: (x - c.x) * c.zoom + v.w / 2, y: (y - c.y) * c.zoom + v.h / 2 };
}
function reefBox() {   // the box round every polyp, with a margin
  const P = game.polyps; if (!P.length) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of P) { x0 = Math.min(x0, p.c); x1 = Math.max(x1, p.c); y0 = Math.min(y0, p.r); y1 = Math.max(y1, p.r); }
  const m = CONFIG.reefMargin;
  return { x0: x0 * CELL - m, y0: y0 * CELL - m, x1: (x1 + 1) * CELL + m, y1: (y1 + 1) * CELL + m };
}
function fitZoom() {   // the zoom that shows the whole reef
  const v = game.view, b = reefBox(); if (!b) return Math.max(v.w / W, v.h / H);
  return Math.max(Math.min(v.w / (b.x1 - b.x0), v.h / (b.y1 - b.y0)), v.w / W, v.h / H);
}
function defaultZoom() {
  const v = game.view, s = v.h / CONFIG.baseViewHeight;
  const f = clamp((game.polyps.length - 1) / (CONFIG.zoomPolypsFull - 1), 0, 1);
  const e = 1 - Math.pow(1 - f, 2);
  return Math.max(s * lerp(CONFIG.zoomStart, CONFIG.zoomEnd, e), v.w / W, v.h / H);
}
function zoomTarget() {
  const v = game.view, s = v.h / CONFIG.baseViewHeight;
  if (game.reefView) return Math.min(fitZoom(), defaultZoom());
  if (game.zoomUser != null) return clamp(game.zoomUser * s, fitZoom(), Math.max(s * CONFIG.zoomMax, fitZoom()));
  return defaultZoom();
}
function wheelZoom(dy) {
  const v = game.view, s = v.h / CONFIG.baseViewHeight, from = game.reefView ? game.cam.zoom : zoomTarget();
  game.reefView = false;
  game.zoomUser = clamp(from * Math.exp(-dy * CONFIG.wheelStep), fitZoom(), Math.max(s * CONFIG.zoomMax, fitZoom())) / s;
}
function toggleReefView(force) {
  const on = force === undefined ? !game.reefView : force;
  if (on && !game.polyps.length) return;
  if (on === game.reefView) return;
  game.reefView = on;
  toast(on ? 'Reef view. Z, Esc or moving to return' : 'Back to you');
}

  const c = game.cam, v = game.view, p = playerPos();
  if (!(v.w > 0 && v.h > 0)) return;   // a hidden tab or embed can start at 0 x 0: wait for a real size instead of dividing by zero
  if (!Number.isFinite(c.x) || !Number.isFinite(c.y) || !(c.zoom > 0)) { c.x = p.x; c.y = p.y; c.zoom = 1; snap = true; }   // never stay stuck on a bad camera
  const M = CONFIG.moments, kk = game.kick ? Math.sin(Math.PI * clamp(game.kick.t / game.kick.life, 0, 1)) : 0;
  const zt = zoomTarget() * (1 + M.kickZoom * kk);
  c.zoom = snap ? zt : lerp(c.zoom, zt, 1 - Math.exp(-CONFIG.zoomSmooth * dt));
  c.zoom = Math.max(c.zoom, v.w / W, v.h / H);
  const k = snap ? 1 : 1 - Math.exp(-CONFIG.camSmooth * (1 - 0.45 * kk) * dt);
  let tx = p.x, ty = p.y, kr = 0;
  if (riseOn() && landInfo().b >= landInfo().a) { tx = (landInfo().a + landInfo().b + 1) / 2 * CELL; ty = -9999; kr = 1; }   // the slow rise: the view eases up to the island and the sky
  else if (game.reefView) {
    const b = reefBox(); if (!b || (!snap && ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].some(k => game.keys.has(k)))) game.reefView = false;
    else { tx = (b.x0 + b.x1) / 2; ty = (b.y0 + b.y1) / 2; }

    const n = game.nudge, b = Math.sin(Math.PI * clamp(n.t / n.life, 0, 1)), dx = n.x - p.x, dy = n.y - p.y, d = Math.hypot(dx, dy) || 1, m = Math.min(d * M.nudgeFrac, M.nudgeMax) * b;

  const F = game.fguide, g = GUIDE_BY[id]; if (!F || !g) return;

}
function fgGrow(type) {   // a polyp of this coral type grew

function fgLoss(cause) {   // polyps (or a larva) were lost to this: the first loss of a meeting counts once, while the threat is unanswered

}
function fgStormEnd(S) {

function fgSeason(prev, next) {   // every season change
  const F = game.fguide, C = CONFIG.guide, n = SEASONS.length; if (!F) return;
  for (const id of RESKINDS) {   // hints for residents not met yet

}

function fgCheck() {   // peaks, one-off judgements, answers, nudges and finished pages

function updateFieldGuide(dt) {   // once a second: timed deeds, then the checks

  updateCamera(dt, false);
}
/* ---------- performance: frame times kept per moment (calm, storm, cyclone, ...), so a slow storm shows up as numbers; dev tools show it, perfReport() prints it ---------- */
const PERF = { tags: {}, cur: '' };
function perfTag() {
  if (game.storm) return game.storm.cyc ? 'cyclone' : 'storm';
  if (game.sp && game.sp.on) return 'spawning';
  if (game.reefView) return 'reef view';
  return 'calm';
}
function perfRec(ms, sim, draw) {
  if (document.hidden || ms > 1000) return;   // a hidden tab or a stall is not a frame
  const k = perfTag(), T = PERF.tags[k] || (PERF.tags[k] = { n: 0, ms: 0, sim: 0, draw: 0, long: 0, worst: 0, ring: new Float32Array(900), ri: 0 });
  T.n++; T.ms += ms; T.sim += sim; T.draw += draw; if (ms > 33.4) T.long++; T.worst = Math.max(T.worst, ms);
  T.ring[T.ri++ % T.ring.length] = ms; PERF.cur = k;
}
function perfRows() {
  return Object.entries(PERF.tags).map(([k, T]) => {
    const r = Array.from(T.ring.slice(0, Math.min(T.ri, T.ring.length))).sort((a, b) => b - a), low = r.length ? r[Math.floor(r.length * 0.01)] : 0;
    return { tag: k, frames: T.n, fps: Math.round(1000 / (T.ms / T.n)), low1: Math.round(1000 / Math.max(low, 1)), simMs: +(T.sim / T.n).toFixed(1), drawMs: +(T.draw / T.n).toFixed(1), longPct: +(100 * T.long / T.n).toFixed(1), worstMs: Math.round(T.worst) };
  });
}
window.perfReport = () => { const r = perfRows(); console.table(r); return r; };
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);   // first, so one bad frame cannot stop the game for good
  if (game.view.w !== window.innerWidth || game.view.h !== window.innerHeight) resize();   // catches a size change with no resize event (an embed that starts hidden)
  const raw = now - last, dt = Math.min(0.05, raw / 1000), t0 = performance.now(); last = now;
  let sc = 1;
  if (game.slow) {   // settle and beats slow the world for a moment; direct calls to step() are never scaled
    game.slow.t -= dt;
    if (game.slow.t <= 0) game.slow = null; else { const u = 1 - game.slow.t / game.slow.life; sc = lerp(game.slow.scale, 1, u * u); }
  }
  if (devs.paused) { if (devs.inf) game.energy = energyCap(); }
  else if (devs.speed === 1 && !devs.inf) step(dt * sc);
  else devStepFor(dt * sc * devs.speed);
  const t1 = performance.now();
  devFrame(dt);
  audio.update(dt);
  const t2 = performance.now();
  render();
  const t3 = performance.now();
  updateHud();
  perfRec(raw, t1 - t0, t3 - t2);
}
resize();
updateLookList();
generateWorld();
initFish();
for (let i = 0; i < CONFIG.plankton; i++) spawnAmbient();
updateCamera(0, true);
if (location.hash === '#notitle') { CONFIG.showTitle = false; SAVE.on = false; }   // test pages never touch a real save
else if (location.hash === '#savetest') { SAVE.key = 'reef.savetest'; CONFIG.showTitle = false; }   // saving on, in its own slot, and no title card unless asked for
renderTrack();
if (saveNotice()) { /* a save was set aside on the last load */ }
if (SAVE.on && saveResume()) welcomeBack(); else if (CONFIG.showTitle) openTitle();
saveHooks();
requestAnimationFrame(frame);
</script>
