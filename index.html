/* ---------- helpers ---------- */
const W = CONFIG.worldW, H = CONFIG.worldH, CELL = CONFIG.cell, LAG = CONFIG.lagoonW;   // W: the whole world; LAG: the lagoon, where the plankton, fish and visitors live
const regionAt = x => x >= CONFIG.flatCol * CELL ? 'flat' : x >= CONFIG.slopeCol * CELL ? 'slope' : 'lagoon';
const REGION_FLOW = { lagoon: 1, slope: 1.4, flat: 0.8 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const key = (c, r) => c + ',' + r;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = rng(CONFIG.seed);
const rr = (a, b) => a + Math.random() * (b - a);

function light(y) { return Math.pow(clamp(1 - y / H, 0, 1), CONFIG.lightPower); }
function lightLabel(l) { return l < CONFIG.dimBelow ? 'Dim' : l < CONFIG.brightAbove ? 'Fair' : 'Bright'; }
function cellCenter(c, r) { return { x: (c + 0.5) * CELL, y: (r + 0.5) * CELL }; }
function inBounds(c, r) { return c >= 0 && r >= 0 && c < game.cols && r < game.rows; }
function isRock(c, r) { return !inBounds(c, r) ? (r >= 0 || false) : game.grid[r * game.cols + c] === 1; }
function cellAt(c, r) { return game.cells.get(key(c, r)); }
function floorY(x) { return game.floorRow[clamp(Math.floor(x / CELL), 0, game.cols - 1)] * CELL; }
function currentAt(x, y, t) { return REGION_FLOW[regionAt(x)] * CONFIG.currentAmp * (Math.sin(t * 0.11 + y * 0.002) * 0.7 + Math.sin(t * 0.27 + 1.3 + x * 0.001) * 0.3) + (game.storm ? stormSurge(x, y, t) : 0); }
function playerPos() {
  if (game.stage === 'polyp' && game.active) return cellCenter(game.active.c, game.active.r);
  return { x: game.larva.x, y: game.larva.y };
}
// coral types: p.type is branch | plate | brain | fan | anemone (p.anemone mirrors the last, kept for the older checks)
const typeOf = p => p.anemone ? 'anemone' : p.type || 'branch';
const tyN = t => t === true ? 'anemone' : t === false || !t ? 'branch' : t;   // older callers pass a boolean
const TY = t => CONFIG.types[tyN(t)] || CONFIG.types.branch;
const TYPE_NAME = { branch: 'Branching', plate: 'Plate', brain: 'Brain', fan: 'Sea fan', anemone: 'Anemone' };
Object.defineProperty(game, 'nextAnemone', { get() { return this.nextType === 'anemone'; }, set(v) { this.nextType = v ? 'anemone' : 'branch'; } });
function budCost(tp = game.nextType) {
  tp = tyN(tp);
  const n = game.polyps.length;   // crowding: a big colony spends more keeping old tissue alive (type and biodiversity factors come later)
  let c = (CONFIG.budCostBase + CONFIG.budCostPerPolyp * Math.max(0, n - 1)) * (1 + n / CONFIG.crowdDiv);
  if (has('G1')) c *= CONFIG.budEnergyFactor;
  if (game.active) { const T = linOf(game.active).traits; c *= (1 - CONFIG.traitGrowth * (T.growth - 3)) * (1 + CONFIG.gen.toughCost * (T.tough - 3)); }   // the source polyp's lineage: Growth cheaper, Toughness dearer
  return tp === 'anemone' ? c * CONFIG.anemoneCostMult + CONFIG.anemoneExtra : c * TY(tp).cost;
}
// energy cap: the larger of the flat floor and a few branching buds' worth, so a big colony can always afford its next bud
const energyCap = () => Math.max(CONFIG.maxEnergy, CONFIG.capBudMult * budCost(false));
const calciumCap = () => CONFIG.calciumMax + (has('G5') ? CONFIG.unl.g5.cap : 0) + game.polyps.reduce((a, p) => a + TY(typeOf(p)).caCap, 0);
function budCalcium(tp = game.nextType) { tp = tyN(tp); return has('G1') ? CONFIG.budCalcium * TY(tp).ca : 0; }
// null when a price {e, ca, bp} can be paid, otherwise what is missing (buds pay energy and calcium, unlocks may also cost BP)
function shortOf(c) {
  if (game.energy < (c.e || 0)) return `Need ${Math.ceil(c.e)} energy`;
  if (game.calcium < (c.ca || 0)) return `Need ${c.ca} calcium`;
  if (game.bp < (c.bp || 0)) return `Need ${c.bp} BP`;
  return null;
}
function budShort(tp = game.nextType) {
  if (game.energy < budCost(tp)) return `Need ${Math.ceil(budCost(tp))} energy to bud`;
  if (game.calcium < budCalcium(tp)) return `Need ${budCalcium(tp)} calcium to bud`;
  return null;
}

/* ---------- guided growth: the colony queues a path of attachable cells and grows along it by itself ---------- */

  for (const p of game.polyps) { prev.set(key(p.c, p.r), null); q.push([p.c, p.r, 0]); }

    for (const [dc, dr] of NB_DIRS) {

      if (prev.has(k) || !free(nc, nr)) continue;

}

  const w = screenToWorld(game.mouse.sx, game.mouse.sy), c = Math.floor(w.x / CELL), r = Math.floor(w.y / CELL);
  if (Math.hypot(c - a.c, r - a.r) > CONFIG.guideRange) { toast('Too far for guided growth'); return; }
  const path = planPath(c, r);
  if (!path) { toast('The colony cannot grow there'); return; }

}

  g.t += dt;

  while (g.path.length && cellAt(g.path[0].c, g.path[0].r)) g.path.shift();   // already grown by hand
  if (!g.path.length) { game.guide = null; game.stats.guideRuns++; toast('Guided growth complete'); return; }
  if (fishInWay(g.path[0].c, g.path[0].r)) { g.t = CONFIG.guideInterval - 0.4; return; }   // a fish is in the way: wait for it to move
  if (!validBudCell(g.path[0].c, g.path[0].r)) {
    const np = planPath(g.target.c, g.target.r);
    if (!np || !validBudCell(np[0].c, np[0].r)) { cancelGuide('Guided growth: the way is blocked'); return; }
    g.path = np;

  const short = budShort(false);

  const from = NB_DIRS.map(([dc, dr]) => cellAt(q.c + dc, q.r + dr)).find(o => o && o.kind === 'polyp');
  const gp = addPolyp(q.c, q.r, false, from && from.ref); game.stats.buds++; afterBud(gp);

  g.t = 0; g.wait = 0;

}

      else p.cd = 0.5;

}

// upkeep from Colony on: every polyp costs energy; at 0 energy the least-lit polyp slowly starves
function upkeep(dt) {
  const C = CONFIG;
  if (game.goals.stage < C.upkeepStage || !game.polyps.length) return;
  let u = 0; for (const p of game.polyps) u += (has('D3') ? C.threat.d3.upkeep : 1) * C.upkeep * (typeOf(p) === 'anemone' ? C.anemoneUpkeep : TY(typeOf(p)).up ?? 1) * (has('F5') && denseP(p) ? CONFIG.unl.f5.upkeep : 1) * (1 + CONFIG.gen.feedUpkeep * (linOf(p).traits.feed - 3));
  game.energy = Math.max(0, game.energy - u * dt);
  if (game.energy > 0) { game.starveT = 0; return; }
  if ((game.starveT = (game.starveT || 0) + dt) < C.starveEvery) return;
  game.starveT = 0;
  let w = null, wl = 9; for (const p of game.polyps) { const l = lightOf(p); if (l < wl) { wl = l; w = p; } }
  if (!w) return;
  w.hp -= C.starveHp; w.lastHit = game.time; w.hurt = 0.6;
  if (!game.progress.starved) { game.progress.starved = true; toast('Out of energy: the dimmest polyps are starving'); }
  if (w.hp <= 0) killPolyp(w);
}

/* ---------- fx / toast ---------- */
function updateFx(dt) {
  for (const f of game.fx) f.t += dt;
  game.fx = game.fx.filter(f => f.t < f.life);
  for (const q of game.parts) {
    q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; const d = Math.exp(-2.2 * dt); q.vx *= d; q.vy = q.vy * d + q.g * dt;

// game toasts wait in a queue while the tree screen is open; feedback for clicks inside the tree shows at once (low on the screen)

  if (game.tree.open && !now) { toastQueue.push(msg); if (toastQueue.length > 6) toastQueue.shift(); return; }
  const box = document.getElementById('toasts');

const lookEl = document.getElementById('looklist');
function updateLookList() {
  const L = game.look;

  let h = '<div class="t">Look test</div>';
  LOOK_FX.forEach((f, i) => {
    const usable = !f.gl || post;
    h += `<div class="row"><span><kbd>${i + 1}</kbd>${f.name}</span><b class="${usable ? (L.on[f.id] ? 'on' : 'off') : 'na'}">${usable ? (L.on[f.id] ? 'on' : 'off') : 'no GL'}</b></div>`;

function toggleAllLook() {
  const L = game.look, ids = LOOK_FX.map(f => f.id);
  if (ids.some(id => L.on[id])) { L.saved = Object.assign({}, L.on); for (const id of ids) L.on[id] = false; }
  else { const s = L.saved && ids.some(id => L.saved[id]) ? L.saved : null; for (const id of ids) L.on[id] = s ? s[id] : true; L.saved = null; }

// returns true when the key belonged to the look test
function lookKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  const code = e.code.indexOf('Numpad') === 0 ? e.code.replace('Numpad', 'Digit') : e.code;
  if (code === 'KeyH') { if (!e.repeat) { game.look.list = !game.look.list; updateLookList(); } return true; }
  if (code === 'KeyK') { if (!e.repeat) setCoral((game.look.coral + 1) % CORAL_STYLES.length); return true; }
  if (code === 'Digit0') { if (!e.repeat) toggleAllLook(); return true; }
  const f = LOOK_FX.find(x => x.code === code);

  if (!e.repeat) toggleLook(f.id);

  for (const p of g) for (const [dc, dr] of NB_DIRS) { const c = p.c + dc, r = p.r + dr, k = key(c, r); if (!cand.has(k) && validBudCell(c, r, 'branch', p) && !fishInWay(c, r)) cand.set(k, { c, r, from: p }); }
  if (!cand.size) return false;
  const L = [...cand.values()]; let pick = null;
  if (plan === 'up') pick = L.sort((a, b) => a.r - b.r || Math.abs(a.c - cx) - Math.abs(b.c - cx))[0];
  else if (plan === 'wide') pick = L.sort((a, b) => Math.abs(b.c - cx) - Math.abs(a.c - cx) || Math.abs(a.r - cy) - Math.abs(b.r - cy))[0];
  else {   // thicken: an empty neighbour of the weakest polyp
    const weak = g.slice().sort((a, b) => strength(a) - strength(b));
    for (const p of weak) { pick = L.find(x => x.from === p) || null; if (pick) break; }
  }
  if (!pick) return false;
  game.energy -= budCost('branch'); game.calcium -= budCalcium('branch');
  const p = addPolyp(pick.c, pick.r, 'branch', pick.from); p.parent = { c: pick.from.c, r: pick.from.r }; rollSport(p, pick.from);
  game.stats.buds++; game.stats.planBuds++; afterBud(p);
  game.fx.push({ kind: 'ring', x: (pick.c + 0.5) * CELL, y: (pick.r + 0.5) * CELL, t: 0, life: 0.6 });
  return true;
}
function updatePlans(dt) {
  const Pl = game.plans, C = CONFIG.unl.g4;
  if (!has('G4')) { Pl.labels = []; return; }
  if ((Pl.lt -= dt) <= 0) {
    Pl.lt = 1; Pl.labels = []; Pl.cur = game.active ? planOf(colonyOf(game.active)) : 'off';
    for (const g of polypGroups(() => true)) { const pl = planOf(g); if (pl === 'off') continue; const top = g.reduce((a, p) => p.r < a.r ? p : a, g[0]); Pl.labels.push({ x: (top.c + 0.5) * CELL, y: top.r * CELL - 12, plan: pl }); }
  }
  if (game.storm) return;   // plans pause during storm waves
  if ((Pl.t += dt) < C.every) return; Pl.t = 0;
  if (game.energy <= energyCap() * C.frac) return;
  for (const g of polypGroups(() => true)) { const pl = planOf(g); if (pl === 'off') continue; if (game.energy <= energyCap() * C.frac) break; planBud(g, pl); }
}
function drawPlans(t) {
  for (const L of game.plans.labels) {
    ctx.save(); ctx.translate(L.x, L.y - Math.sin(t * 2) * 2); ctx.font = '700 13px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(8,30,50,0.75)'; roundRectPath(-30, -13, 60, 18, 8); ctx.fill();
    ctx.fillStyle = '#ffe3a0'; ctx.fillText((L.plan === 'up' ? '\u25B2 ' : L.plan === 'wide' ? '\u25C4\u25BA ' : '\u25A0 ') + PLAN_NAME[L.plan], 0, 0);
    ctx.restore();
  }
  for (const q of game.newRock) {   // S4: dead coral that cemented into rock
    const g = ctx.createLinearGradient(0, q.r * CELL, 0, (q.r + 1) * CELL); g.addColorStop(0, '#b09886'); g.addColorStop(1, '#8a7870');
    ctx.fillStyle = g; roundRectPath(q.c * CELL - 0.5, q.r * CELL - 0.5, CELL + 1, CELL + 1, 6); ctx.fill();
  }
}

/* ---------- main loop ---------- */
function step(dt) {
  if (game.tree.open || game.titleOn) return;   // the tree screen and the title card pause the game
  game.time += dt;
  game.current = currentAt(game.larva.x, game.larva.y, game.time);
  if (game.stage === 'larva' && !game.riding) updateLarva(dt); else game.settleTarget = null;
  if (!devs.noFish) updateFish(dt);
  if (!devs.noNib) updateNibblers(dt);
  updateClown(dt); updateResidents(dt); shooFish(dt);
  updateDayNight(dt); updateStreaks(dt);
  updatePlankton(dt);
  updatePolyps(dt);
  updateBud(dt);
  updateGuide(dt);
  updateSeason(dt); updateEvents(dt); updateAch(dt); updateTreeStats(dt); updateS4(dt); updatePlans(dt); updateThreats(dt); updateStorm(dt); updateFrags(dt); updateReport(dt); updateSportPick(dt); updateSpawn(dt); updateRegions(dt); if (game.xOpen && (game.tstX = (game.tstX || 0) - dt) <= 0) { game.tstX = 0.5; renderX(); } if (game.linView && (game.tstL = (game.tstL || 0) - dt) <= 0) { game.tstL = 0.5; renderLinView(); }
  game.sting.cd = Math.max(0, game.sting.cd - dt);
  checkReveals();
  if ((game.goals.chk -= dt) <= 0) { game.goals.chk = 0.25; checkStage(); }
  updateFx(dt);
  if (game.kick && (game.kick.t += dt) >= game.kick.life) game.kick = null;
  if (game.nudge && (game.nudge.t += dt) >= game.nudge.life) game.nudge = null;
  updateCamera(dt, false);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let sc = 1;
  if (game.slow) {   // settle and beats slow the world for a moment; direct calls to step() are never scaled
    game.slow.t -= dt;
    if (game.slow.t <= 0) game.slow = null; else { const u = 1 - game.slow.t / game.slow.life; sc = lerp(game.slow.scale, 1, u * u); }
  }
  if (devs.paused) { if (devs.inf) game.energy = energyCap(); }
  else if (devs.speed === 1 && !devs.inf) step(dt * sc);
  else devStepFor(dt * sc * devs.speed);
  devFrame(dt);
  audio.update(dt);
  render();
  updateHud();
  requestAnimationFrame(frame);
}
resize();
updateLookList();
generateWorld();
initFish();
for (let i = 0; i < CONFIG.plankton; i++) spawnAmbient();
updateCamera(0, true);
if (location.hash === '#notitle') CONFIG.showTitle = false;
renderTrack(); if (CONFIG.showTitle) openTitle();
requestAnimationFrame(frame);
</script>
