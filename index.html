<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reef</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #031326; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud { position: fixed; left: 12px; top: 12px; padding: 8px 12px; min-width: 150px; background: rgba(2, 16, 32, 0.55); color: #d6f2ff; border-radius: 8px; font-size: 13px; line-height: 1.55; pointer-events: none; }
  #hud b { color: #fff; font-weight: 600; }
  #hud .row { display: flex; justify-content: space-between; gap: 18px; }
  #hud .stage { font-size: 15px; font-weight: 700; color: #ffd9c9; margin-bottom: 2px; }
  #bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); margin: 2px 0 3px; overflow: hidden; }
  #barfill { height: 100%; width: 0; background: #7be3b0; transition: background 0.2s; }
  #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 7px 16px; background: rgba(2, 16, 32, 0.6); color: #e8f8ff; border-radius: 16px; font-size: 14px; pointer-events: none; white-space: nowrap; }
  #toasts { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .toast { padding: 7px 16px; background: rgba(255, 244, 230, 0.92); color: #3a2a2a; border-radius: 14px; font-size: 14px; font-weight: 600; animation: tin 0.25s ease-out; transition: opacity 0.5s; }
  .toast.out { opacity: 0; }
  #ui { position: fixed; left: 0; top: 0; pointer-events: none; }
  #looklist { position: fixed; right: 12px; top: 12px; padding: 7px 11px; background: rgba(2, 16, 32, 0.5); color: #cfeaf6; border-radius: 8px; font-size: 12px; line-height: 1.5; pointer-events: none; min-width: 150px; }
  #looklist .t { font-weight: 700; color: #ffd9c9; margin-bottom: 1px; }
  #looklist .row { display: flex; justify-content: space-between; gap: 14px; }
  #looklist kbd { font: inherit; display: inline-block; min-width: 11px; margin-right: 5px; padding: 0 3px; text-align: center; border-radius: 3px; background: rgba(255,255,255,0.16); color: #fff; }
  #looklist .on { color: #8ff0c0; } #looklist .off { color: #8aa0b2; } #looklist .na { color: #667788; }
  @keyframes tin { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="stage" id="hStage">Larva</div>
  <div class="row"><span>Energy</span><b id="hEnergy">0</b></div>
  <div id="bar"><div id="barfill"></div></div>
  <div class="row"><span>Polyps</span><b id="hPolyps">0</b></div>
  <div class="row"><span>Light</span><b id="hLight">-</b></div>
</div>
<div id="hint"></div>
<div id="toasts"></div>
<div id="looklist"></div>
<script>
"use strict";

const CONFIG = {
  worldW: 2800, worldH: 1500, cell: 26,
  seed: 7,
  // camera
  zoomStart: 1.55, zoomEnd: 0.72, zoomPolypsFull: 16, zoomSmooth: 1.6, camSmooth: 4.5, baseViewHeight: 760,
  // water and light
  lightPower: 1.15, dimBelow: 0.35, brightAbove: 0.65,
  currentAmp: 22, currentLarvaFactor: 0.8,
  // plankton
  plankton: 170, planktonEnergy: 3, planktonRadius: 3.2,
  bloomFirst: 6, bloomInterval: 50, bloomSize: 45, bloomSpread: 70, bloomMinPlayerDist: 800, bloomFloorClear: 350,
  // energy
  startEnergy: 30, maxEnergy: 100, swimDrain: 0.35, sunRate: 0.3, emptySpeedFactor: 0.4,
  // larva
  larvaRadius: 8, larvaAccel: 430, larvaDrag: 2.4, settleReach: 10, eatPad: 6,
  // predators
  fishCount: 2, fishRadius: 15, fishPatrolSpeed: 65, fishChaseSpeed: 150, fishSense: 230, fishGiveUp: 380,
  hitLossFraction: 1 / 3, hitKnockback: 430, invulnerable: 2.0, fishRetreat: 2.5,
  // polyps
  tentacleReach: 120, tentacleIdleLen: 32, tentacleSpeed: 7, pullRadius: 36, pullSpeed: 230, eatDist: 9,
  budTime: 1.2, budCostBase: 10, budCostPerPolyp: 0.8,
  automationAt: 5, autoRadius: 75, autoInterval: 2.6, autoPullTime: 0.4, autoEnergy: 2,
  // look test (visual only)
  look: {
    causticStrength: 1.9, causticScale: 1 / 170, shaftStrength: 0.42, bloomStrength: 0.8, bloomLow: 0.82, bloomHigh: 0.6, bloomKnee: 0.16,
    hazeStrength: 0.42, hazeFar: 0.22, vignette: 0.3, grade: 1, wobblePx: 1.6, wobbleClear: 120,
    rockScale: 1.25, rockBlurNarrow: 9, rockBlurWide: 24, rockWobble: 90, rockRough: 30,
    coralScale: 2.5, coralBlurNarrow: 3.6, coralBlurWide: 8, coralWobble: 40,
    reefRef: 1100,
    reefLayers: [
      { f: 0.22, y0: -110, h: 300, seed: 11, top: [92, 170, 205], bottom: [34, 104, 150], alpha: 0.34, blur: 3 },
      { f: 0.40, y0: -30, h: 280, seed: 23, top: [54, 128, 170], bottom: [16, 70, 112], alpha: 0.46, blur: 2 },
      { f: 0.62, y0: 50, h: 240, seed: 37, top: [26, 88, 126], bottom: [6, 38, 72], alpha: 0.62, blur: 1 },
    ],
    snowCount: 150, snowAlpha: 0.5, foregroundAlpha: 0.6, foregroundClear: 230,
  },
};

const game = {
  time: 0,
  stage: 'larva',            // 'larva' | 'polyp'
  energy: CONFIG.startEnergy,
  cols: Math.ceil(CONFIG.worldW / CONFIG.cell),
  rows: Math.ceil(CONFIG.worldH / CONFIG.cell),
  grid: null,                // 0 water, 1 rock
  floorRow: null,
  cells: new Map(),          // "c,r" -> {kind:'polyp'|'skel', ref}
  polyps: [],
  skeletons: [],
  active: null,
  larva: { x: 1300, y: 330, vx: 0, vy: 0, inv: 0, ang: 0, wag: 0 },
  plankton: [],
  fish: [],
  fx: [],
  keys: new Set(),
  mouse: { sx: 0, sy: 0, down: false },
  cam: { x: 1300, y: 330, zoom: 1 },
  view: { w: 800, h: 600, dpr: 1 },
  facing: null,
  bud: { t: 0, armed: false, fail: 0 },
  tent: { ext: 0, hx: 0, hy: -60 },
  hop: null,
  progress: { settled: false, tentacled: false, budded: false, hopped: false },
  unlocked: false,
  bloom: { next: CONFIG.bloomFirst, x: 0, y: 0, count: 0 },
  current: 0,
  settleTarget: null,
  look: { on: { caustics: true, shafts: true, bloom: true, haze: true, wobble: true, organic: true, layers: true }, saved: null, list: true },
};

/* ---------- helpers ---------- */
const W = CONFIG.worldW, H = CONFIG.worldH, CELL = CONFIG.cell;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const key = (c, r) => c + ',' + r;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = rng(CONFIG.seed);
const rr = (a, b) => a + Math.random() * (b - a);

function light(y) { return Math.pow(clamp(1 - y / H, 0, 1), CONFIG.lightPower); }
function lightLabel(l) { return l < CONFIG.dimBelow ? 'Dim' : l < CONFIG.brightAbove ? 'Fair' : 'Bright'; }
function cellCenter(c, r) { return { x: (c + 0.5) * CELL, y: (r + 0.5) * CELL }; }
function inBounds(c, r) { return c >= 0 && r >= 0 && c < game.cols && r < game.rows; }
function isRock(c, r) { return !inBounds(c, r) ? (r >= 0 || false) : game.grid[r * game.cols + c] === 1; }
function cellAt(c, r) { return game.cells.get(key(c, r)); }
function floorY(x) { return game.floorRow[clamp(Math.floor(x / CELL), 0, game.cols - 1)] * CELL; }
function currentAt(x, y, t) { return CONFIG.currentAmp * (Math.sin(t * 0.11 + y * 0.002) * 0.7 + Math.sin(t * 0.27 + 1.3 + x * 0.001) * 0.3); }
function playerPos() {
  if (game.stage === 'polyp' && game.active) return cellCenter(game.active.c, game.active.r);
  return { x: game.larva.x, y: game.larva.y };
}
function budCost() { return CONFIG.budCostBase + CONFIG.budCostPerPolyp * Math.max(0, game.polyps.length - 1); }

/* ---------- world generation ---------- */
function generateWorld() {
  const cols = game.cols, rows = game.rows;
  game.grid = new Uint8Array(cols * rows);
  game.floorRow = new Int16Array(cols);
  const outcrops = [
    { c: 22, w: 5, h: 10 }, { c: 55, w: 7, h: 19 }, { c: 64, w: 3, h: 9 },
    { c: 88, w: 3.2, h: 27 }, { c: 98, w: 5, h: 12 }, { c: 40, w: 2.5, h: 6 },
  ];
  for (let c = 0; c < cols; c++) {
    let f = 47 + 2.0 * Math.sin(c * 0.09) + 0.9 * Math.sin(c * 0.23 + 2) + rand() * 0.6;
    for (const o of outcrops) f -= o.h * Math.exp(-Math.pow((c - o.c) / o.w, 2)) * (0.9 + rand() * 0.2);
    game.floorRow[c] = clamp(Math.round(f), 6, rows - 4);
    for (let r = game.floorRow[c]; r < rows; r++) game.grid[r * cols + c] = 1;
  }
  // render rock once
  const cv = document.createElement('canvas');
  cv.width = cols * CELL; cv.height = rows * CELL;
  const g = cv.getContext('2d');
  const hr = rng(99);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (!game.grid[r * cols + c]) continue;
    const l = light(r * CELL);
    const n = (hr() - 0.5) * 14;
    const k = 0.62 + 0.5 * l;
    g.fillStyle = `rgb(${Math.round(92 * k + n)},${Math.round(90 * k + n)},${Math.round(108 * k + n)})`;
    const open = !isRock(c, r - 1) || !isRock(c - 1, r) || !isRock(c + 1, r);
    if (open && r < rows - 1) { g.beginPath(); g.roundRect(c * CELL - 0.5, r * CELL - 0.5, CELL + 1, CELL + 1, 5); g.fill(); }
    else g.fillRect(c * CELL - 0.5, r * CELL - 0.5, CELL + 1, CELL + 1);
  }
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (!game.grid[r * cols + c] || isRock(c, r - 1)) continue;
    const l = light(r * CELL);
    g.fillStyle = `rgba(${Math.round(80 + 80 * l)},${Math.round(130 + 80 * l)},${Math.round(90 + 40 * l)},${0.35 + 0.4 * l})`;
    g.fillRect(c * CELL + 1, r * CELL, CELL - 2, 4);
  }
  game.rockCanvas = cv;
  buildRockOrganic();
  buildReef();
  buildForeground();
}

/* ---------- plankton ---------- */
function spawnAmbient() {
  for (let i = 0; i < 30; i++) {
    const x = rr(0, W), y = rr(25, H - 60);
    const c = Math.floor(x / CELL), r = Math.floor(y / CELL);
    if (isRock(c, r)) continue;
    if (Math.random() < clamp((floorY(x) - y) / 350, 0.06, 1)) { game.plankton.push(mkPlankton(x, y, false)); return; }
  }
}
function mkPlankton(x, y, b) { return { x, y, b, ph: Math.random() * 6.28, cap: null, pulled: false, dead: false }; }
function maybeBloom() {
  if (game.time < game.bloom.next) return;
  const p = playerPos();
  for (let i = 0; i < 60; i++) {
    const x = rr(200, W - 200), y = rr(160, H - 400);
    if (Math.hypot(x - p.x, y - p.y) < CONFIG.bloomMinPlayerDist) continue;
    if (floorY(x) - y < CONFIG.bloomFloorClear) continue;
    for (let k = 0; k < CONFIG.bloomSize; k++) {
      const a = Math.random() * 6.28, d = Math.sqrt(Math.random()) * CONFIG.bloomSpread;
      const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d * 0.7;
      if (!isRock(Math.floor(px / CELL), Math.floor(py / CELL))) game.plankton.push(mkPlankton(px, py, true));
    }
    game.bloom.next = game.time + CONFIG.bloomInterval;
    toast(`A plankton bloom glimmers to the ${x > p.x ? 'east' : 'west'}`);
    return;
  }
  game.bloom.next = game.time + 5;
}
function updatePlankton(dt) {
  const t = game.time;
  let ambient = 0, bc = 0, bx = 0, by = 0;
  for (const p of game.plankton) {
    if (p.dead) continue;
    if (p.cap) {
      const c = cellCenter(p.cap.poly.c, p.cap.poly.r);
      const d = Math.hypot(c.x - p.x, c.y - p.y);
      if (p.cap.poly.dead) { p.cap = null; }
      else {
        const s = Math.max(d, 1), v = Math.max(d / 0.12, 60) * dt;
        p.x += (c.x - p.x) / s * Math.min(v, d); p.y += (c.y - p.y) / s * Math.min(v, d);
        if (d < 6) { p.dead = true; gain(CONFIG.autoEnergy, c.x, c.y - 14); }
        continue;
      }
    }
    const cur = currentAt(p.x, p.y, t);
    p.x += (cur * 0.9 + Math.sin(t * 0.7 + p.ph) * 6) * dt;
    p.y += (Math.cos(t * 0.5 + p.ph * 1.7) * 5 - 1.5) * dt;
    if (p.x < 0) p.x += W; if (p.x > W) p.x -= W;
    p.y = clamp(p.y, 6, H - 10);
    if (isRock(Math.floor(p.x / CELL), Math.floor(p.y / CELL))) p.y -= 40 * dt + 2;
    if (p.b) { bc++; bx += p.x; by += p.y; } else ambient++;
  }
  game.plankton = game.plankton.filter(p => !p.dead);
  game.bloom.count = bc;
  if (bc) { game.bloom.x = bx / bc; game.bloom.y = by / bc; }
  let n = Math.min(3, Math.ceil(dt * 20));
  while (ambient < CONFIG.plankton && n-- > 0) { spawnAmbient(); ambient++; }
  maybeBloom();
}
function gain(a, x, y) {
  game.energy = Math.min(CONFIG.maxEnergy, game.energy + a);
  game.fx.push({ kind: 'text', x, y, t: 0, life: 0.9, text: '+' + (Math.round(a * 10) / 10) });
}

/* ---------- cells / polyps ---------- */
function addPolyp(c, r) {
  const p = { c, r, pop: 1, cd: 1 + Math.random() * 2, dead: false, seed: Math.random() * 10 };
  game.polyps.push(p);
  game.cells.set(key(c, r), { kind: 'polyp', ref: p });
  if (!game.unlocked && game.polyps.length >= CONFIG.automationAt) {
    game.unlocked = true;
    toast('Polyps now feed themselves');
  }
  return p;
}
function setActive(p) {
  game.active = p; game.facing = null;
  game.bud.t = 0; game.bud.armed = false;
  game.tent.ext = 0; game.tent.hx = 0; game.tent.hy = -60;
  p.pop = 1;
}
function attachable(c, r) {
  if (!inBounds(c, r)) return false;
  return game.grid[r * game.cols + c] === 1 || !!cellAt(c, r);
}
function rectDist(px, py, c, r) {
  const dx = Math.max(c * CELL - px, 0, px - (c + 1) * CELL);
  const dy = Math.max(r * CELL - py, 0, py - (r + 1) * CELL);
  return Math.hypot(dx, dy);
}
function findSettleTarget() {
  const L = game.larva, c = Math.floor(L.x / CELL), r = Math.floor(L.y / CELL);
  if (!inBounds(c, r) || isRock(c, r)) return null;
  const here = cellAt(c, r);
  if (here && here.kind === 'polyp') return null;
  const reach = CONFIG.larvaRadius + CONFIG.settleReach;
  if (here && here.kind === 'skel') return { c, r, skel: here.ref };
  for (const [dc, dr] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
    if (attachable(c + dc, r + dr) && rectDist(L.x, L.y, c + dc, r + dr) <= reach) return { c, r, skel: null };
  }
  for (const [dc, dr] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
    const o = cellAt(c + dc, r + dr);
    if (o && o.kind === 'skel' && rectDist(L.x, L.y, c + dc, r + dr) <= reach) return { c: c + dc, r: r + dr, skel: o.ref };
  }
  return null;
}
function trySettle() {
  const t = findSettleTarget();
  if (!t) return false;
  if (t.skel) {
    game.skeletons = game.skeletons.filter(s => s !== t.skel);
    game.cells.delete(key(t.c, t.r));
  }
  const p = addPolyp(t.c, t.r);
  game.stage = 'polyp';
  setActive(p);
  if (!game.progress.settled) { game.progress.settled = true; toast('Settled. Hold the mouse to catch plankton'); }
  else toast('Settled');
  game.fx.push({ kind: 'ring', x: (t.c + 0.5) * CELL, y: (t.r + 0.5) * CELL, t: 0, life: 0.6 });
  return true;
}
function bail() {
  if (game.stage !== 'polyp' || !game.active) return;
  const p = game.active, cc = cellCenter(p.c, p.r);
  p.dead = true;
  game.polyps = game.polyps.filter(q => q !== p);
  const s = { c: p.c, r: p.r };
  game.skeletons.push(s);
  game.cells.set(key(p.c, p.r), { kind: 'skel', ref: s });
  game.active = null; game.stage = 'larva'; game.facing = null;
  game.bud.t = 0; game.bud.armed = false; game.tent.ext = 0;
  const L = game.larva;
  L.x = cc.x; L.y = cc.y; L.vx = 0; L.vy = -30; L.inv = 1.0;
  game.fx.push({ kind: 'ring', x: cc.x, y: cc.y, t: 0, life: 0.6 });
  toast('You swim free, leaving a skeleton behind');
}

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function validBudCell(c, r) {
  if (!inBounds(c, r) || game.grid[r * game.cols + c] === 1 || cellAt(c, r)) return false;
  for (const [dc, dr] of Object.values(DIRS)) {
    const o = cellAt(c + dc, r + dr);
    if (o && o.kind === 'polyp') return true;
  }
  return false;
}
function tryHop(dir) {
  const a = game.active; if (!a) return;
  const [dc, dr] = DIRS[dir], c = a.c + dc, r = a.r + dr;
  const o = cellAt(c, r);
  game.bud.t = 0;
  if (o && o.kind === 'polyp') {
    const from = cellCenter(a.c, a.r);
    setActive(o.ref);
    game.hop = { fx: from.x, fy: from.y, t: 0 };
    game.progress.hopped = true;
  } else if (validBudCell(c, r)) {
    game.facing = { c, r };
  } else {
    game.facing = null;
  }
}
function pressSpace() {
  if (game.stage === 'larva') { trySettle(); return; }
  const b = game.bud;
  if (!game.facing) { toast('Press a direction to pick a cell first'); return; }
  const cost = budCost();
  if (game.energy < cost) { b.fail = 0.9; b.armed = false; toast(`Need ${Math.ceil(cost)} energy to bud`); return; }
  b.armed = true; b.t = 0;
}
function updateBud(dt) {
  const b = game.bud;
  b.fail = Math.max(0, b.fail - dt);
  if (game.stage !== 'polyp') return;
  if (game.facing && !validBudCell(game.facing.c, game.facing.r)) { game.facing = null; b.t = 0; b.armed = false; }
  if (!b.armed || !game.keys.has('Space') || !game.facing) { b.t = 0; b.armed = false; return; }
  b.t += dt;
  if (b.t < CONFIG.budTime) return;
  const cost = budCost(), f = game.facing;
  b.t = 0; b.armed = false;
  if (game.energy < cost) { b.fail = 0.9; toast(`Need ${Math.ceil(cost)} energy to bud`); return; }
  game.energy -= cost;
  const p = addPolyp(f.c, f.r);
  setActive(p);
  game.progress.budded = true;
  game.fx.push({ kind: 'ring', x: (f.c + 0.5) * CELL, y: (f.r + 0.5) * CELL, t: 0, life: 0.6 });
  toast(`New polyp (${game.polyps.length})`);
}

/* ---------- larva movement ---------- */
function solidFor(c, r, curKey) {
  if (r < 0) return true;
  if (c < 0 || c >= game.cols || r >= game.rows) return true;
  if (game.grid[r * game.cols + c] === 1) return true;
  const o = cellAt(c, r);
  return !!o && key(c, r) !== curKey;
}
function blockedAt(x, y, rad, curKey) {
  for (const sx of [-rad, rad]) for (const sy of [-rad, rad]) {
    if (solidFor(Math.floor((x + sx) / CELL), Math.floor((y + sy) / CELL), curKey)) return true;
  }
  return false;
}
function held(dir) {
  const k = game.keys;
  return dir === 'up' ? (k.has('KeyW') || k.has('ArrowUp')) : dir === 'down' ? (k.has('KeyS') || k.has('ArrowDown'))
    : dir === 'left' ? (k.has('KeyA') || k.has('ArrowLeft')) : (k.has('KeyD') || k.has('ArrowRight'));
}
function updateLarva(dt) {
  const L = game.larva, t = game.time;
  let ix = (held('right') ? 1 : 0) - (held('left') ? 1 : 0), iy = (held('down') ? 1 : 0) - (held('up') ? 1 : 0);
  const m = Math.hypot(ix, iy); if (m) { ix /= m; iy /= m; }
  const weak = game.energy <= 0 ? CONFIG.emptySpeedFactor : 1;
  L.vx += (ix * CONFIG.larvaAccel * weak + currentAt(L.x, L.y, t) * CONFIG.larvaDrag * CONFIG.currentLarvaFactor) * dt;
  L.vy += iy * CONFIG.larvaAccel * weak * dt;
  const damp = Math.exp(-CONFIG.larvaDrag * dt);
  L.vx *= damp; L.vy *= damp;
  if (m && game.energy > 0) game.energy = Math.max(0, game.energy - CONFIG.swimDrain * dt);
  const ck = key(Math.floor(L.x / CELL), Math.floor(L.y / CELL)), rad = CONFIG.larvaRadius;
  let nx = L.x + L.vx * dt;
  if (blockedAt(nx, L.y, rad, ck) || nx < rad || nx > W - rad) L.vx *= -0.25; else L.x = nx;
  let ny = L.y + L.vy * dt;
  if (blockedAt(L.x, ny, rad, ck) || ny < rad + 3) L.vy *= -0.25; else L.y = ny;
  L.inv = Math.max(0, L.inv - dt);
  const sp = Math.hypot(L.vx, L.vy);
  if (sp > 12) { const a = Math.atan2(L.vy, L.vx); let d = a - L.ang; d = Math.atan2(Math.sin(d), Math.cos(d)); L.ang += d * (1 - Math.exp(-9 * dt)); }
  L.wag += dt * (4 + sp * 0.06);
  // eat plankton
  const er = rad + CONFIG.planktonRadius + CONFIG.eatPad;
  for (const p of game.plankton) {
    if (p.dead || p.cap) continue;
    if (Math.abs(p.x - L.x) < er && Math.abs(p.y - L.y) < er && Math.hypot(p.x - L.x, p.y - L.y) < er) {
      p.dead = true; gain(CONFIG.planktonEnergy, p.x, p.y - 8);
    }
  }
  game.settleTarget = findSettleTarget();
}

/* ---------- predators ---------- */
function initFish() {
  const homes = [[600, 450, 150, 1250], [2100, 600, 1500, 2650]];
  for (let i = 0; i < CONFIG.fishCount; i++) {
    const h = homes[i % homes.length];
    game.fish.push({ x: h[0], y: h[1], vx: 40, vy: 0, mode: 'patrol', tx: h[0], ty: h[1], cool: 0, x0: h[2], x1: h[3], head: 0 });
    pickWaypoint(game.fish[i]);
  }
}
function pickWaypoint(f) {
  for (let i = 0; i < 30; i++) {
    const x = rr(f.x0, f.x1), y = rr(110, 950);
    if (!blockedAt(x, y, CONFIG.fishRadius, '')) { f.tx = x; f.ty = y; return; }
  }
}
function updateFish(dt) {
  const L = game.larva, R = CONFIG.fishRadius;
  for (const f of game.fish) {
    f.cool = Math.max(0, f.cool - dt);
    const d = Math.hypot(L.x - f.x, L.y - f.y);
    const canChase = game.stage === 'larva' && L.inv <= 0 && f.cool <= 0;
    if (f.mode === 'chase') { if (!canChase || d > CONFIG.fishGiveUp) { f.mode = 'patrol'; pickWaypoint(f); } }
    else if (canChase && d < CONFIG.fishSense) f.mode = 'chase';
    let tx = f.tx, ty = f.ty, sp = CONFIG.fishPatrolSpeed;
    if (f.mode === 'chase') { tx = L.x; ty = L.y; sp = CONFIG.fishChaseSpeed; }
    else if (Math.hypot(tx - f.x, ty - f.y) < 30) pickWaypoint(f);
    const dd = Math.hypot(tx - f.x, ty - f.y) || 1;
    const k = 1 - Math.exp(-2.5 * dt);
    f.vx = lerp(f.vx, (tx - f.x) / dd * sp, k); f.vy = lerp(f.vy, (ty - f.y) / dd * sp, k);
    const nx = f.x + f.vx * dt, ny = f.y + f.vy * dt;
    let hit = false;
    if (blockedAt(nx, f.y, R * 0.7, '') || nx < 40 || nx > W - 40) { f.vx *= -0.5; hit = true; } else f.x = nx;
    if (blockedAt(f.x, ny, R * 0.7, '') || ny < 40) { f.vy *= -0.5; hit = true; } else f.y = ny;
    if (hit && f.mode === 'patrol') pickWaypoint(f);
    if (Math.hypot(f.vx, f.vy) > 8) f.head = Math.atan2(f.vy, f.vx);
    if (game.stage === 'larva' && L.inv <= 0 && Math.hypot(L.x - f.x, L.y - f.y) < R + CONFIG.larvaRadius) {
      const lost = game.energy * CONFIG.hitLossFraction;
      game.energy -= lost;
      const dx = L.x - f.x, dy = L.y - f.y, m = Math.hypot(dx, dy) || 1;
      L.vx = dx / m * CONFIG.hitKnockback; L.vy = dy / m * CONFIG.hitKnockback;
      L.inv = CONFIG.invulnerable; f.cool = CONFIG.fishRetreat; f.mode = 'patrol'; pickWaypoint(f);
      f.vx = -dx / m * 60; f.vy = -dy / m * 60;
      game.fx.push({ kind: 'ring', x: L.x, y: L.y, t: 0, life: 0.5, red: true });
      toast(`Caught! Lost ${Math.round(lost)} energy`);
    }
  }
}

/* ---------- polyp updates ---------- */
function updatePolyps(dt) {
  const t = game.time;
  for (const p of game.polyps) {
    p.pop = Math.max(0, p.pop - dt * 3.5);
    const cc = cellCenter(p.c, p.r);
    game.energy = Math.min(CONFIG.maxEnergy, game.energy + CONFIG.sunRate * light(cc.y) * dt);
  }
  if (game.hop) { game.hop.t += dt; if (game.hop.t > 0.35) game.hop = null; }
  if (game.stage === 'polyp' && game.active) {
    const a = game.active, cc = cellCenter(a.c, a.r), T = game.tent;
    const w = screenToWorld(game.mouse.sx, game.mouse.sy);
    if (game.mouse.down) {
      let dx = w.x - cc.x, dy = w.y - cc.y; const m = Math.hypot(dx, dy);
      if (m > CONFIG.tentacleReach) { dx *= CONFIG.tentacleReach / m; dy *= CONFIG.tentacleReach / m; }
      const k = 1 - Math.exp(-14 * dt);
      T.hx = lerp(T.hx, dx, k); T.hy = lerp(T.hy, dy, k);
    }
    T.ext = clamp(T.ext + (game.mouse.down ? 1 : -1) * CONFIG.tentacleSpeed * dt, 0, 1);
    if (game.mouse.down && T.ext > 0.7) {
      const tx = cc.x + T.hx, ty = cc.y + T.hy;
      for (const p of game.plankton) {
        if (p.dead || p.cap) continue;
        const d = Math.hypot(tx - p.x, ty - p.y);
        if (d < CONFIG.pullRadius) {
          if (d < CONFIG.eatDist) { p.dead = true; gain(CONFIG.planktonEnergy, tx, ty - 8); game.progress.tentacled = true; }
          else { p.x += (tx - p.x) / d * CONFIG.pullSpeed * dt; p.y += (ty - p.y) / d * CONFIG.pullSpeed * dt; }
        }
      }
    }
  }
  if (game.unlocked) {
    for (const p of game.polyps) {
      if (p === game.active) continue;
      p.cd -= dt;
      if (p.cd > 0) continue;
      const cc = cellCenter(p.c, p.r);
      let best = null, bd = CONFIG.autoRadius;
      for (const q of game.plankton) {
        if (q.dead || q.cap) continue;
        const d = Math.hypot(q.x - cc.x, q.y - cc.y);
        if (d < bd) { bd = d; best = q; }
      }
      if (best) { best.cap = { poly: p }; p.cd = CONFIG.autoInterval * (0.8 + Math.random() * 0.4); }
      else p.cd = 0.5;
    }
  }
}

/* ---------- fx / toast ---------- */
function updateFx(dt) {
  for (const f of game.fx) f.t += dt;
  game.fx = game.fx.filter(f => f.t < f.life);
}
function toast(msg) {
  const box = document.getElementById('toasts');
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  box.appendChild(el);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(() => el.classList.add('out'), 2300);
  setTimeout(() => el.remove(), 2900);
}

/* ---------- camera ---------- */
function screenToWorld(sx, sy) {
  const c = game.cam, v = game.view;
  return { x: (sx - v.w / 2) / c.zoom + c.x, y: (sy - v.h / 2) / c.zoom + c.y };
}
function worldToScreen(x, y) {
  const c = game.cam, v = game.view;
  return { x: (x - c.x) * c.zoom + v.w / 2, y: (y - c.y) * c.zoom + v.h / 2 };
}
function zoomTarget() {
  const v = game.view, s = v.h / CONFIG.baseViewHeight;
  const f = clamp((game.polyps.length - 1) / (CONFIG.zoomPolypsFull - 1), 0, 1);
  const e = 1 - Math.pow(1 - f, 2);
  return Math.max(s * lerp(CONFIG.zoomStart, CONFIG.zoomEnd, e), v.w / W, v.h / H);
}
function updateCamera(dt, snap) {
  const c = game.cam, v = game.view, p = playerPos();
  const zt = zoomTarget();
  c.zoom = snap ? zt : lerp(c.zoom, zt, 1 - Math.exp(-CONFIG.zoomSmooth * dt));
  c.zoom = Math.max(c.zoom, v.w / W, v.h / H);
  const k = snap ? 1 : 1 - Math.exp(-CONFIG.camSmooth * dt);
  c.x = lerp(c.x, p.x, k); c.y = lerp(c.y, p.y, k);
  const hw = v.w / c.zoom / 2, hh = v.h / c.zoom / 2;
  c.x = hw * 2 >= W ? W / 2 : clamp(c.x, hw, W - hw);
  c.y = hh * 2 >= H ? H / 2 : clamp(c.y, hh, H - hh);
}

  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 7 + Math.sin(x * 0.02 + t * 1.3) * 3 + Math.sin(x * 0.05 - t) * 1.5);
  ctx.lineTo(W, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 40) { const y = 7 + Math.sin(x * 0.02 + t * 1.3) * 3 + Math.sin(x * 0.05 - t) * 1.5; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
}
function drawPolypBodyOrganic(p, t, active) {   // the tissue itself comes from the cached layer
  const cc = cellCenter(p.c, p.r), s = 1 + 0.22 * p.pop, br = 1 + 0.08 * Math.sin(t * 1.6 + p.seed);
  ctx.save(); ctx.translate(cc.x, cc.y); ctx.scale(s, s);
  if (p.pop > 0.02) {
    ctx.strokeStyle = `rgba(255,236,210,${p.pop * 0.7})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 13 + 14 * (1 - p.pop), 0, 6.3); ctx.stroke();
  }
  if (active) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 5);
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 34);
    g.addColorStop(0, 'rgba(255,245,170,0.5)'); g.addColorStop(1, 'rgba(255,245,170,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 6.3); ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${0.7 + 0.3 * pulse})`; ctx.lineWidth = 2.2;
    roundRectPath(-14.5, -14.5, 29, 29, 12); ctx.stroke();
  }
  const g = ctx.createRadialGradient(-1.5, -2, 0.5, 0, 0, 8.5);
  g.addColorStop(0, active ? 'rgba(255,240,228,0.95)' : 'rgba(255,222,204,0.85)'); g.addColorStop(1, 'rgba(255,170,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#6a1f35'; ctx.beginPath(); ctx.ellipse(0, -0.4, 3.2 * br, 2.5 * br, 0, 0, 6.3); ctx.fill();
  ctx.strokeStyle = 'rgba(255,236,226,0.75)'; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.ellipse(0, -0.4, 3.6 * br, 2.9 * br, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  ctx.restore();
}
function drawPolypBody(p, t, active) {
  if (game.look.on.organic) return drawPolypBodyOrganic(p, t, active);
  const cc = cellCenter(p.c, p.r), l = light(cc.y);
  const s = 1 + 0.22 * p.pop;
  ctx.save(); ctx.translate(cc.x, cc.y); ctx.scale(s, s);
  if (active) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 5);
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 34);
    g.addColorStop(0, 'rgba(255,245,170,0.55)'); g.addColorStop(1, 'rgba(255,245,170,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 6.3); ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${0.7 + 0.3 * pulse})`; ctx.lineWidth = 2.2;
    roundRectPath(-14.5, -14.5, 29, 29, 9); ctx.stroke();
  }
  ctx.fillStyle = active ? '#ff9c86' : '#f27d73';
  roundRectPath(-10.5, -10.5, 21, 21, 7); ctx.fill();
  ctx.fillStyle = active ? '#ffd6c8' : '#f9b3a4';
  roundRectPath(-6, -9, 12, 7, 3); ctx.fill();
  ctx.fillStyle = '#7a2a3a'; ctx.beginPath(); ctx.arc(0, -1, 2.6, 0, 6.3); ctx.fill();
  ctx.restore();
}
function drawSkeleton(s) {
  const cc = cellCenter(s.c, s.r);
  ctx.save(); ctx.translate(cc.x, cc.y);
  ctx.fillStyle = '#ece6d6'; roundRectPath(-11, -11, 22, 22, 7); ctx.fill();
  ctx.strokeStyle = '#b7ae98'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, -1, 3.2, 0, 6.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-7, 6); ctx.lineTo(-2, 3); ctx.moveTo(7, 6); ctx.lineTo(2, 3); ctx.stroke();
  ctx.restore();
}
function drawPolypTentacles(t) {
  const act = game.active;
  for (const p of game.polyps) {
    const cc = cellCenter(p.c, p.r);
    if (p === act && game.stage === 'polyp') {
      const T = game.tent;
      for (let k = 0; k < 4; k++) {
        const ia = -Math.PI / 2 + (k - 1.5) * 0.45 + Math.sin(t * 0.9 + k * 1.3) * 0.25, il = CONFIG.tentacleIdleLen + k * 4;
        const itx = cc.x + Math.cos(ia) * il, ity = cc.y + Math.sin(ia) * il;
        const m = Math.hypot(T.hx, T.hy) || 1, px = -T.hy / m * (k - 1.5) * 3.5, py = T.hx / m * (k - 1.5) * 3.5;
        const htx = cc.x + T.hx + px, hty = cc.y + T.hy + py;
        const e = T.ext * T.ext * (3 - 2 * T.ext);
        tentacle(cc.x, cc.y - 6, lerp(itx, htx, e), lerp(ity, hty, e), k, lerp(3, 7, e), 2.4, game.mouse.down ? '#ffc0a8' : '#f9a493', t, lerp(2.5, 7, e));
      }
    } else if (game.look.on.organic) {
      for (let k = 0; k < 5; k++) {
        const a = -Math.PI / 2 + (k - 2) * 0.52 + Math.sin(t * 0.8 + p.seed + k) * 0.2, l = 15 + (k % 2) * 3 + 2 * Math.sin(t * 0.7 + p.seed * 2 + k);
        tentacle(cc.x + Math.cos(a) * 4.5, cc.y + Math.sin(a) * 4.5 - 1, cc.x + Math.cos(a) * l, cc.y + Math.sin(a) * l - 1, k, 1.6, 2.6, '#f6a89c', t, 2.5);
      }
    } else {
      for (let k = 0; k < 3; k++) {
        const a = -Math.PI / 2 + (k - 1) * 0.6 + Math.sin(t * 0.8 + p.seed + k) * 0.25;
        tentacle(cc.x, cc.y - 6, cc.x + Math.cos(a) * 16, cc.y + Math.sin(a) * 16, k, 2, 1.8, '#f6a89c', t, 2.5);
      }
    }
  }
  for (const q of game.plankton) {
    if (!q.cap || q.dead) continue;
    const c = cellCenter(q.cap.poly.c, q.cap.poly.r);
    tentacle(c.x, c.y - 4, q.x, q.y, 1, 3, 2, '#ffd0bf', t, 9);
  }
}
function drawGhost(t) {
  const f = game.facing; if (!f || game.stage !== 'polyp') return;
  const cc = cellCenter(f.c, f.r), b = game.bud, cost = budCost();
  const can = game.energy >= cost;
  let shake = b.fail > 0 ? Math.sin(t * 60) * 2.5 * b.fail : 0;
  ctx.save(); ctx.translate(cc.x + shake, cc.y);
  ctx.setLineDash([5, 4]); ctx.lineDashOffset = -t * 12;
  ctx.strokeStyle = b.fail > 0 ? '#ff6a6a' : can ? 'rgba(255,255,255,0.95)' : 'rgba(255,190,150,0.9)'; ctx.lineWidth = 2;
  roundRectPath(-11, -11, 22, 22, 7); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; roundRectPath(-11, -11, 22, 22, 7); ctx.fill();
  if (b.t > 0) {
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(0, 0, 19, 0, 6.3); ctx.stroke();
    ctx.strokeStyle = '#fff2a8'; ctx.beginPath(); ctx.arc(0, 0, 19, -Math.PI / 2, -Math.PI / 2 + Math.min(1, b.t / CONFIG.budTime) * 6.2832); ctx.stroke();
  } else if (b.fail > 0) {
    ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,90,90,${b.fail})`; ctx.beginPath(); ctx.arc(0, 0, 19, 0, 6.3); ctx.stroke();
  }
  ctx.restore();
  const z = 1 / game.cam.zoom;
  ctx.font = `600 ${12 * z}px "Segoe UI", sans-serif`; ctx.textAlign = 'center';
  ctx.fillStyle = can ? '#e8fbff' : '#ffb59a';
  ctx.fillText(can ? `Space: bud (${Math.ceil(cost)})` : `Need ${Math.ceil(cost)} energy`, cc.x, cc.y - 22);
}
function drawPlankton(t) {
  if (game.look.on.organic) return drawPlanktonOrganic(t);
  ctx.globalCompositeOperation = 'lighter';
  for (const p of game.plankton) {
    const a = 0.55 + 0.35 * Math.sin(t * 2 + p.ph);
    ctx.fillStyle = `rgba(150,255,210,${a * 0.10})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, CONFIG.planktonRadius * 2.6, 0, 6.3); ctx.fill();
    ctx.fillStyle = `rgba(215,255,235,${a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, CONFIG.planktonRadius, 0, 6.3); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawFish(f, t) {
  ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.head);
  if (Math.cos(f.head) < 0) ctx.scale(1, -1);
  const chase = f.mode === 'chase', wag = Math.sin(t * (chase ? 14 : 7) + f.x) * 5;
  ctx.fillStyle = chase ? '#e0503a' : '#b9553f';
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-27, -9 + wag); ctx.lineTo(-27, 9 + wag); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 9.5, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#7e2e2a'; ctx.beginPath(); ctx.moveTo(-4, -8); ctx.lineTo(4, -15); ctx.lineTo(8, -7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe9d6'; ctx.beginPath(); ctx.arc(11, -2.5, 3.4, 0, 6.3); ctx.fill();
  ctx.fillStyle = chase ? '#c00' : '#222'; ctx.beginPath(); ctx.arc(12, -2.5, 1.7, 0, 6.3); ctx.fill();
  ctx.restore();
}
function drawLarva(t) {
  if (game.stage !== 'larva') return;
  const L = game.larva;
  if (L.inv > 0 && Math.floor(t * 12) % 2 === 0) return;
  const g = ctx.createRadialGradient(L.x, L.y, 2, L.x, L.y, 22);
  g.addColorStop(0, 'rgba(255,230,200,0.45)'); g.addColorStop(1, 'rgba(255,230,200,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(L.x, L.y, 22, 0, 6.3); ctx.fill();
  ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(L.ang);
  ctx.strokeStyle = '#ffd7c2'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i <= 8; i++) { const u = i / 8; const x = -6 - u * 14, y = Math.sin(L.wag - u * 4) * 4 * u; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  ctx.fillStyle = '#ffe9dc'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 6.2, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#ff9a8a'; ctx.beginPath(); ctx.ellipse(-2, 0, 4.5, 3.6, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#2a1a2a'; ctx.beginPath(); ctx.arc(5, -1.5, 1.4, 0, 6.3); ctx.fill();
  ctx.restore();
}
function drawFx() {
  const z = 1 / game.cam.zoom;
  for (const f of game.fx) {
    const u = f.t / f.life;
    if (f.kind === 'text') {
      ctx.font = `700 ${13 * z}px "Segoe UI", sans-serif`; ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(210,255,225,${1 - u})`; ctx.fillText(f.text, f.x, f.y - u * 22);
    } else {
      ctx.strokeStyle = f.red ? `rgba(255,110,90,${1 - u})` : `rgba(255,255,255,${1 - u})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, 8 + u * 34, 0, 6.3); ctx.stroke();
    }
  }
  if (game.hop && game.active) {
    const to = cellCenter(game.active.c, game.active.r), u = game.hop.t / 0.35;
    ctx.strokeStyle = `rgba(255,245,170,${1 - u})`; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(game.hop.fx, game.hop.fy); ctx.lineTo(lerp(game.hop.fx, to.x, Math.min(1, u * 2)), lerp(game.hop.fy, to.y, Math.min(1, u * 2)) - Math.sin(u * 3.14) * 6); ctx.stroke();
  }
}
function drawSettleHint(t) {
  const s = game.settleTarget; if (!s || game.stage !== 'larva') return;
  const cc = cellCenter(s.c, s.r);
  ctx.save(); ctx.translate(cc.x, cc.y);
  ctx.setLineDash([5, 4]); ctx.lineDashOffset = -t * 10; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
  roundRectPath(-11, -11, 22, 22, 7); ctx.stroke(); ctx.restore();
}
function drawOverlay(t) {
  const v = game.view; ctx.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
  ctx.textAlign = 'center';
  const s = game.settleTarget;
  if (s && game.stage === 'larva') {
    const cc = cellCenter(s.c, s.r), p = worldToScreen(cc.x, cc.y);
    const lab = lightLabel(light(cc.y)), txt = `Space: settle here   Light: ${lab}`;
    ctx.font = '600 13px "Segoe UI", sans-serif';
    const w = ctx.measureText(txt).width + 22, y = p.y - 38 - Math.sin(t * 4) * 2;
    ctx.fillStyle = 'rgba(2,16,32,0.7)'; roundRectPath(p.x - w / 2, y - 14, w, 26, 13); ctx.fill();
    ctx.fillStyle = lab === 'Bright' ? '#fff3a8' : lab === 'Fair' ? '#d6f2ff' : '#a9bfd6';
    ctx.fillText(txt, p.x, y + 4);
  }
  // bloom pointer
  if (game.bloom.count > 8) {
    const p = worldToScreen(game.bloom.x, game.bloom.y), m = 34;
    if (p.x < m || p.x > v.w - m || p.y < m || p.y > v.h - m) {
      const cx = v.w / 2, cy = v.h / 2, dx = p.x - cx, dy = p.y - cy;
      const k = Math.min((v.w / 2 - m) / Math.abs(dx || 1e-6), (v.h / 2 - m) / Math.abs(dy || 1e-6));

      ctx.save(); ctx.translate(x, y); ctx.rotate(a);
      ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t * 3);
      ctx.fillStyle = '#bfffe0'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-7, -9); ctx.lineTo(-7, 9); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}
function worldTransform(g) {
  const v = game.view, c = game.cam;
  g.setTransform(v.dpr * c.zoom, 0, 0, v.dpr * c.zoom, v.dpr * (v.w / 2 - c.x * c.zoom), v.dpr * (v.h / 2 - c.y * c.zoom));
}
function render() {
  const t = game.time, L = game.look, on = L.on;
  L.sigP = cellSig(game.polyps); L.sigS = cellSig(game.skeletons);
  const sm = L.sigP + L.sigS * 7 + (on.organic ? 1 : 0);
  if (sm !== L.sigM) { L.sigM = sm; refreshMask(); }
  if (on.organic) ensureCoral();
  worldTransform(ctx);
  drawBackground(t);
  if (on.layers) drawReef();
  ctx.drawImage(on.organic ? game.rockOrganic : game.rockCanvas, 0, 0, game.cols * CELL, game.rows * CELL);
  drawSurface(t);
  if (on.organic) drawCoralLayer(L.skelLayer);
  else for (const s of game.skeletons) drawSkeleton(s);
  if (!post) drawSettleHint(t);
  drawPlankton(t);
  if (on.organic) drawCoralLayer(L.polyLayer);
  for (const p of game.polyps) drawPolypBody(p, t, p === game.active && game.stage === 'polyp');
  drawPolypTentacles(t);
  if (!post) drawGhost(t);
  for (const f of game.fish) drawFish(f, t);
  drawLarva(t);
  if (on.layers) { drawSnow(t); drawForeground(t); worldTransform(ctx); }
  if (post) {   // hints, ghost cell and effects sit on their own canvas so the shaders never dim them
    uctx.setTransform(1, 0, 0, 1, 0, 0); uctx.clearRect(0, 0, uiCv.width, uiCv.height);
    worldTransform(uctx);
    const scene = ctx; ctx = uctx;
    drawSettleHint(t); drawGhost(t); drawFx(); drawOverlay(t);
    ctx = scene;
    present();
  } else { drawFx(); drawOverlay(t); }
}

/* ---------- HUD ---------- */
const el = id => document.getElementById(id);
const hud = { stage: el('hStage'), energy: el('hEnergy'), polyps: el('hPolyps'), light: el('hLight'), bar: el('barfill'), hint: el('hint') };
function currentHint() {
  const pr = game.progress, n = game.polyps.length;
  if (game.stage === 'larva') return pr.settled ? 'Find rock or your colony and press Space to settle again' : 'Swim (WASD) and find rock to settle on. Eat plankton for energy';
  if (!pr.tentacled) return 'Hold the mouse to catch plankton with your tentacles';
  if (!pr.budded) return game.energy < budCost() ? `Catch plankton: you need ${Math.ceil(budCost())} energy to bud` : 'Press a direction, then hold Space to bud a polyp';
  if (!pr.hopped) return n < 2 ? 'Press a direction, then hold Space to bud a polyp' : 'Press WASD toward another polyp to hop to it';
  return 'R bails out: you swim free as a larva';
}
function updateHud() {
  const p = playerPos(), l = light(p.y);
  hud.stage.textContent = game.stage === 'larva' ? 'Larva' : game.polyps.length >= 2 ? 'Colony' : 'Polyp';
  hud.energy.textContent = Math.round(game.energy);
  hud.bar.style.width = (game.energy / CONFIG.maxEnergy * 100) + '%';
  hud.bar.style.background = game.energy < 8 ? '#ff8a7a' : '#7be3b0';
  hud.polyps.textContent = game.polyps.length;
  hud.light.textContent = `${lightLabel(l)} (${Math.round(l * 100)}%)`;
  const h = currentHint(); if (hud.hint.textContent !== h) hud.hint.textContent = h;
}

/* ---------- input ---------- */
const GAME_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyR']);
window.addEventListener('keydown', e => {
  if (lookKey(e)) return;
  if (!GAME_KEYS.has(e.code)) return;
  e.preventDefault();
  game.keys.add(e.code);
  if (e.repeat) return;
  if (e.code === 'Space') pressSpace();
  else if (e.code === 'KeyR') bail();
  else if (game.stage === 'polyp') {
    const d = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' }[e.code];
    if (d) tryHop(d);
  }
});
window.addEventListener('keyup', e => { game.keys.delete(e.code); });
window.addEventListener('blur', () => { game.keys.clear(); game.mouse.down = false; });
canvas.addEventListener('mousedown', e => { if (e.button === 0) game.mouse.down = true; game.mouse.sx = e.clientX; game.mouse.sy = e.clientY; });
window.addEventListener('mouseup', e => { if (e.button === 0) game.mouse.down = false; });
window.addEventListener('mousemove', e => { game.mouse.sx = e.clientX; game.mouse.sy = e.clientY; });
window.addEventListener('resize', resize);

/* ---------- main loop ---------- */
function step(dt) {
  game.time += dt;
  game.current = currentAt(game.larva.x, game.larva.y, game.time);
  if (game.stage === 'larva') updateLarva(dt); else game.settleTarget = null;
  updateFish(dt);
  updatePlankton(dt);
  updatePolyps(dt);
  updateBud(dt);
  updateFx(dt);
  updateCamera(dt, false);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt);
  render();
  updateHud();
  requestAnimationFrame(frame);
}
resize();
updateLookList();
generateWorld();
initFish();
for (let i = 0; i < CONFIG.plankton; i++) spawnAmbient();
updateCamera(0, true);
requestAnimationFrame(frame);
</script>
